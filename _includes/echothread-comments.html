<section class="post-discussion" aria-labelledby="discussion-title">
  <div class="discussion-heading">
    <span class="discussion-eyebrow">Your turn</span>
    <h2 id="discussion-title">Join the conversation</h2>
    <p>Leave a thought or question. No account needed—just choose a display name.</p>
  </div>

  <div
    id="echothread"
    data-shortname="{{ site.echothread.shortname | escape }}"
    data-api-key="{{ site.echothread.api_key | escape }}"
    data-page-url="{{ page.url | absolute_url | escape }}"
    data-identifier="{{ page.id | slugify | escape }}"
    data-page-title="{{ page.title | escape }}"
    data-theme-source="--main-bg"
    data-accent-color="#7c9cff"
    data-font-family="inherit"
    data-radius="18px"
  >
    <p class="discussion-loading">Loading the discussion…</p>
  </div>
</section>

<script src="https://cdn.echothread.io/widget.js" async></script>
