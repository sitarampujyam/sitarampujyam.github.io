<!-- Google Fonts for Reader Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">

<!-- Early theme & reader preferences initialization to avoid FOUC -->
<script>
  (function () {
    try {
      var lightScheme = localStorage.getItem('site-light-scheme') || 'white';
      var darkScheme = localStorage.getItem('site-dark-scheme') || 'lights-out';
      document.documentElement.setAttribute('data-light-scheme', lightScheme);
      document.documentElement.setAttribute('data-dark-scheme', darkScheme);

      var readerFont = localStorage.getItem('reader-font') || 'default';
      var readerSize = localStorage.getItem('reader-size') || '100';
      var readerSpacing = localStorage.getItem('reader-spacing') || 'normal';
      var readerWidth = localStorage.getItem('reader-width') || 'normal';
      var readerAlign = localStorage.getItem('reader-align') || 'justify';

      document.documentElement.setAttribute('data-reader-font', readerFont);
      document.documentElement.setAttribute('data-reader-size', readerSize);
      document.documentElement.setAttribute('data-reader-spacing', readerSpacing);
      document.documentElement.setAttribute('data-reader-width', readerWidth);
      document.documentElement.setAttribute('data-reader-align', readerAlign);

      if (readerSize && readerSize !== '100') {
        document.documentElement.style.setProperty('--reader-font-scale', (parseInt(readerSize, 10) / 100).toString());
      }
    } catch (e) {
      console.warn('Preferences init error:', e);
    }
  })();
</script>
